<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>
  <div class="page">
    <h1>Products</h1>

    <form id="productForm" class="card">
      <h2 id="formTitle">Add Product</h2>
      <input type="hidden" id="productId">
      <input type="text" id="name" placeholder="Product name" required>
      <input type="text" id="description" placeholder="Description (optional)">
      <input type="number" id="price" placeholder="Price" min="1" step="any" required>
      <button type="submit">Save Product</button>
      <button type="button" id="cancelBtn" class="secondary" style="display:none">Cancel</button>
    </form>

    <input type="text" id="search" placeholder="Search by product name...">

    <table>
      <thead>
        <tr><th>Name</th><th>Description</th><th>Price</th><th>Action</th></tr>
      </thead>
      <tbody id="productTable"></tbody>
    </table>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
