<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Order Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-box">
    <h1>Order Management System</h1>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <p id="error" class="error"></p>
    </form>
    <p class="small-link">New customer? <a href="signup.html">Sign up here</a></p>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (login(username, password)) {
        const user = getCurrentUser();
        window.location.href = user.role === "customer" ? "my-orders.html" : "dashboard.html";
      } else {
        document.getElementById("error").textContent = "Wrong username or password.";
      }
    });
  </script>
</body>
</html>
