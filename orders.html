<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>
  <div class="page">
    <h1>Orders</h1>
    <p><a class="button" href="order-new.html">+ New Order</a></p>

    <div class="row">
      <input type="text" id="search" placeholder="Search by order number or customer name...">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option>New</option>
        <option>Processing</option>
        <option>Ready for Delivery</option>
        <option>Delivered</option>
        <option>Cancelled</option>
      </select>
    </div>

    <table>
      <thead>
        <tr><th>Order No.</th><th>Customer</th><th>Date</th><th>Status</th><th>Total</th><th>Action</th></tr>
      </thead>
      <tbody id="orderTable"></tbody>
    </table>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
